services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/sshd crowdsecurity/nginx crowdsecurity/http-cve"
      GID: "1000"
    volumes:
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      # Log di sistema (SSH, auth) in sola lettura
      - /var/log:/var/log:ro
      # Log di Nginx: decommenta e imposta il percorso corretto
      # - /percorso/log/nginx:/var/log/nginx:ro
    ports:
      - "127.0.0.1:8081:8080"  # LAPI esposta solo in localhost

volumes:
  crowdsec-config:
  crowdsec-data:
